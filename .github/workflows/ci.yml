name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's binary is only needed for the smoke run; skip it on the
      # fast path and let the smoke step control its own install.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Offline evaluations
        run: |
          npm run evaluate
          npm run evaluate:cognition
          npm run evaluate:companion

      - name: Build application bundles
        run: npm run build

      - name: Install Electron binary for smoke
        run: node node_modules/electron/install.js

      - name: Install xvfb (Linux headless display for Electron)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64

      - name: Electron smoke (real app, isolated profile, no network egress)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run smoke
          else
            npm run smoke
          fi

  windows-install-path:
    name: Windows upgrade path (schema migrations under the real app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migration and persistence test pass (includes v1→v15 upgrade paths)
        run: npx vitest run src/persistence
