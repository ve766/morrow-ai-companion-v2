name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, tests, build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron's binary is only needed for the smoke run; skip it on the
      # fast path and let the smoke step control its own install.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild better-sqlite3 for Node
        run: npm rebuild better-sqlite3

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Offline evaluations
        run: |
          npm run evaluate
          npm run evaluate:cognition

      - name: Build application bundles
        run: npm run build

      - name: Install Electron binary for smoke
        run: node node_modules/electron/install.js

      - name: Electron smoke (real app, isolated profile, no network egress)
        run: npm run smoke

  windows-install-path:
    name: Windows upgrade path (schema migrations under the real app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rebuild better-sqlite3 for Node
        run: npm rebuild better-sqlite3
      - name: Migration and persistence test pass (includes v1→v15 upgrade paths)
        run: npx vitest run src/persistence
